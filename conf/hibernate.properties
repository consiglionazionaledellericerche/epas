org.hibernate.envers.audit_table_suffix=_history
org.hibernate.envers.revision_field_name=_revision
org.hibernate.envers.revision_type_field_name=_revision_type
org.hibernate.envers.revision_on_collection_change=false

hibernate.physical_naming_strategy = models.base.OurPhysicalNamingStrategy
hibernate.implicit_naming_strategy =models.base.OurImplicitNamingStrategy
hibernate.generate_statistics = true

jadira.usertype.autoRegisterUserTypes=true
jadira.usertype.databaseZone=jvm
jadira.usertype.javaZone=jvm

# Nessun hibernate.default_batch_fetch_size globale (issue #707): caricando a blocchi tutte le
# collezioni lazy, Hibernate carica anche i dati di altre sedi e persone presenti nella sessione
# (configurazioni, ruoli, riepiloghi mensili) e il dirty checking eseguito prima di ogni query
# rallenta le pagine dell'amministratore fino a 2 volte. Il caricamento a blocchi è attivato
# con @BatchSize solo sulle associazioni che generano query ripetute.
# Nota: in Play 1.5.3 le proprietà hibernate.* di application.conf non arrivano a Hibernate,
# vanno impostate qui.

# Statistiche delle query per ogni sessione (richiesta o job), vedi helpers.jpa.QueryStatsListener
# e il parametro jpa.queryStats.threshold in application.conf.
hibernate.session.events.auto = helpers.jpa.QueryStatsListener
