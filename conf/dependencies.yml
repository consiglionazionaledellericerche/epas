# Application dependencies

require:
    - play:
       # xstream e commons-fileupload sono dichiarate sotto in versione aggiornata
       exclude:
        - com.thoughtworks.xstream -> xstream
        - commons-fileupload -> commons-fileupload
    - play -> secure
    - play -> shibboleth 1.2
    - play-codeborne -> fastergt 1.10
    - org.hibernate -> hibernate-envers 5.4.1.Final:
       transitive: false
    # spring-core serve solo all'integrazione con spring di jadira bindings, non usata
    - org.jadira.usertype -> usertype.core 6.0.1.GA:
       exclude:
        - org.springframework -> spring-core
    - com.google.guava -> guava 33.7.2-jre
    - com.google.inject -> guice 5.0.1:
       exclude:
        - org.ow2.asm -> asm *
    - com.google.inject.extensions -> guice-assistedinject 5.0.1:
       exclude:
        - org.ow2.asm -> asm *
    - org.eclipse.jdt.core.compiler -> ecj 4.6.1
    - play -> pdf 0.9:
       exclude:
        - jaxen -> jaxen *
    - org.mnode.ical4j -> ical4j 3.0.25
    - org.jsoup -> jsoup 1.23.2
    # usata solo dai test: le dipendenze escluse (vulnerabili) non servono
    - org.dbunit -> dbunit 2.5.1:
       exclude:
        - commons-collections -> commons-collections
        - org.apache.poi -> poi-ooxml
        - org.apache.poi -> poi-ooxml-schemas
        - org.apache.xmlbeans -> xmlbeans
    - org.mockito -> mockito-core 3.11.0
    - org.assertj -> assertj-core 3.19.0:
       exclude:
        - org.ow2.asm -> asm *
    - org.assertj -> assertj-guava 3.4.0:
       exclude:
        - org.ow2.asm -> asm *
    - org.drools -> drools-core 5.6.0.Final:
       # xstream è dichiarata sotto in versione aggiornata
       exclude:
        - com.thoughtworks.xstream -> xstream
    - org.drools -> drools-compiler 5.6.0.Final:
       # xstream è dichiarata sotto in versione aggiornata
       exclude:
        - com.thoughtworks.xstream -> xstream
    - net.lingala.zip4j -> zip4j 2.8.0
    - com.querydsl -> querydsl-codegen 4.2.2:
        exclude:
          - asm -> asm *
          - cglib -> cglib *
          - org.apache.geronimo.specs -> geronimo-jpa_3.0_spec *
          - com.google.code.morphia -> morphia *
          - org.mongodb.morphia -> morphia *
          - org.springframework.roo -> org.springframework.roo.annotations *
          - org.eclipse.persistence -> eclipselink *
          - org.hibernate.javax.persistence -> hibernate-jpa-2.0-api *
    - com.querydsl -> querydsl-jpa 4.2.2:
       exclude:
        - asm -> asm *
        - cglib -> cglib *
        - org.apache.geronimo.specs -> geronimo-jpa_3.0_spec *
        - com.google.code.morphia -> morphia *
        - org.mongodb.morphia -> morphia *
        - org.springframework.roo -> org.springframework.roo.annotations *
        - org.eclipse.persistence -> eclipselink *
        - org.hibernate.javax.persistence -> hibernate-jpa-2.0-api *
    - com.querydsl -> querydsl-apt 4.2.2:
       exclude:
        - asm -> asm *
        - cglib -> cglib *
        - org.apache.geronimo.specs -> geronimo-jpa_3.0_spec *
        - com.google.code.morphia -> morphia *
        - org.mongodb.morphia -> morphia *
        - org.springframework.roo -> org.springframework.roo.annotations *
        - org.eclipse.persistence -> eclipselink *
        - org.hibernate.javax.persistence -> hibernate-jpa-2.0-api *
    - play-codeborne -> lombok 1.2.5
    - org.projectlombok -> lombok 1.18.20
    - com.fatboyindustrial.gson-jodatime-serialisers -> gson-jodatime-serialisers 1.8.0
    - com.fatboyindustrial.gson-javatime-serialisers -> gson-javatime-serialisers 1.1.1
    - com.fasterxml.jackson.core -> jackson-core 2.21.8
    - com.fasterxml.jackson.core -> jackson-annotations 2.21
    - com.fasterxml.jackson.core -> jackson-databind 2.21.8
    - com.fasterxml.jackson.datatype -> jackson-datatype-hibernate5 2.21.8
    - com.fasterxml.jackson.datatype -> jackson-datatype-joda 2.21.8
    - com.fasterxml.jackson.datatype -> jackson-datatype-jsr310 2.21.8
    - com.fasterxml.jackson.module -> jackson-module-afterburner 2.21.8
    - com.github.fge -> jackson-coreutils 1.8
    - org.testng -> testng 6.9.10
    - org.apache.poi -> poi 3.16
    # amqp-client serve solo per l'invio via AMQP, non usato (si usa UDP/TCP)
    - org.graylog2 -> gelfj 1.1.16:
       exclude:
        - com.rabbitmq -> amqp-client
    - org.apache.commons -> commons-csv 1.8
    - org.apache.commons -> commons-compress 1.28.0
    - io.micrometer -> micrometer-registry-prometheus 1.15.12
    - org.postgresql ->  postgresql 42.2.29:
       force: true
       exclude:
        - org.osgi -> org.osgi.core
        - org.osgi -> org.osgi.enterprise
    - xerces -> xercesImpl 2.12.2
    # Versioni aggiornate di librerie incluse in play 1.5.3 (framework/lib): le librerie
    # dell'applicazione (lib/) precedono quelle del framework nel classpath. Le versioni
    # sostituite sono rimosse dall'immagine docker (Dockerfile).
    - ch.qos.reload4j -> reload4j 1.2.27:
       exclude:
        - javax.jms -> javax.jms-api
    # senza dipendenze transitive: quelle opzionali (servlet, portlet, jdom, xom, ...) non
    # servono e play le includerebbe
    - commons-fileupload -> commons-fileupload 1.6.0:
       force: true
       transitive: false
    - com.thoughtworks.xstream -> xstream 1.4.21:
       force: true
       transitive: false
    - io.github.x-stream -> mxparser 1.2.2
    - org.yaml -> snakeyaml 1.33:
       force: true
    - org.dom4j -> dom4j 2.1.4:
       force: true
       # dipendenze opzionali non usate
       exclude:
        - pull-parser -> *
        - xpp3 -> *
        - net.java.dev.msv -> *
        - relaxngDatatype -> *
        - javax.xml.stream -> *
        - javax.xml.bind -> *
        - jaxen -> *
    - commons-beanutils -> commons-beanutils 1.11.0:
       force: true
       transitive: false
    - org.apache.commons -> commons-email 1.6.0:
       force: true
       transitive: false
    # JavaMail 1.6 richiesta da commons-email 1.6 (la mail-1.4.7 di play e' rimossa
    # dall'immagine). Dichiarata esplicitamente per non dipendere da quella portata da
    # ical4j; activation e' quella di play (framework/lib)
    - com.sun.mail -> javax.mail 1.6.2:
       force: true
       transitive: false
    - com.google.code.gson -> gson 2.13.2:
       force: true
       transitive: false
    # richieste da commons-compress, commons-fileupload e tika-core (helpers.ImageUtils)
    - commons-io -> commons-io 2.20.0:
       force: true
    - commons-codec -> commons-codec 1.19.0:
       force: true
    - it.cnr.iit -> play-qmodel 1.5.3
    - org.modelmapper -> modelmapper 2.4.4
    # serve solo il riconoscimento dei mime type (helpers.ImageUtils). Senza dipendenze
    # transitive: commons-io e' dichiarata sopra, slf4j-api e' quella di play (la 2.x
    # richiesta da tika non troverebbe il binding log4j di play)
    - org.apache.tika -> tika-core 3.3.3:
       transitive: false
    - io.jsonwebtoken -> jjwt-impl 0.11.5
    - io.jsonwebtoken -> jjwt-jackson 0.11.5
    - io.github.openfeign -> feign-core 12.4
    - io.github.openfeign -> feign-gson 12.4
    - io.github.openfeign -> feign-micrometer 12.4
    - com.auth0 -> jwks-rsa 0.19.0

# My custom repository

repositories:
    - codeborne:
        type: http
        artifact: https://repo.codeborne.com/play-[module]/[module]-[revision].zip
        contains:
            - play-codeborne -> *
    - github:
         type:      http
         artifact:  "https://github.com/jackmoore/colorbox"
         contains:
            - com.github -> *
    - compatibility:
        type: local
        artifact: ${application.path}/jars/[module]-[revision].jar
        contains:
          - it.cnr.iit -> play-qmodel 1.5.3
