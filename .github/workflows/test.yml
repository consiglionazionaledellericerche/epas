name: Test

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# Su una PR una nuova push annulla l'esecuzione precedente ancora in corso.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autotest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        # Le dipendenze di conf/dependencies.yml sono scaricate da ivy: la cache evita
        # di riscaricarle a ogni esecuzione.
        name: Cache delle dipendenze
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('conf/dependencies.yml') }}
          restore-keys: ivy-
      -
        # Stessa immagine del Dockerfile (Play 1.5.3, JDK 11, python2). play autotest
        # esegue unit test, functional test e selenium su H2 in memoria. Esce con 1 se
        # trova test-result/result.failed, ma con 0 se non trova nessun risultato: per
        # questo si controlla anche che esista result.passed.
        name: play autotest
        run: |
          mkdir -p ~/.ivy2
          docker run --rm -u root \
            -v "$PWD:/app" -v "$HOME/.ivy2:/root/.ivy2" -w /app \
            -e HOST_IDS="$(id -u):$(id -g)" \
            criluc/play1:1.5.3-temurin-11-patched \
            sh -c 'play deps --sync && play autotest && test -f test-result/result.passed;
                   status=$?; chown -R "$HOST_IDS" /app /root/.ivy2; exit $status'
      -
        name: Archivia i risultati dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: test-result/
          if-no-files-found: ignore
