name: Test

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# Su una PR una nuova push annulla l'esecuzione precedente ancora in corso; su main
# no, così ogni commit mergiato ha il proprio esito.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  autotest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        # Le dipendenze di conf/dependencies.yml (e i jar locali in jars/) sono gestite
        # da ivy: la cache evita di riscaricarle a ogni esecuzione. Niente restore-keys,
        # altrimenti la cache accumulerebbe all'infinito le versioni vecchie.
        name: Cache delle dipendenze
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('conf/dependencies.yml', 'jars/**') }}
      -
        # Stessa immagine del Dockerfile (Play 1.5.3, JDK 11, python2), letta dalla sua
        # riga ARG PLAY_IMAGE: il digest è scritto in un solo posto. play autotest
        # esegue unit test, functional test e selenium su H2 in memoria. Esce con 1 se
        # trova test-result/result.failed, ma con 0 se non trova nessun risultato: per
        # questo si controlla anche che esista result.passed. Anche play deps esce con 0
        # quando non riesce a risolvere qualche dipendenza: si cerca il messaggio nel log.
        # Se la JVM termina con exit 0 prima di "Server is up and running", autotest resta
        # in attesa all'infinito: timeout lo interrompe prima del timeout del job, così
        # chown e l'archiviazione dei risultati vengono comunque eseguiti.
        name: play autotest
        run: |
          mkdir -p ~/.ivy2
          IMAGE=$(sed -n 's/^ARG PLAY_IMAGE=//p' Dockerfile)
          test -n "$IMAGE" || { echo "ARG PLAY_IMAGE non trovato nel Dockerfile"; exit 1; }
          docker run --rm -u root \
            -v "$PWD:/app" -v "$HOME/.ivy2:/root/.ivy2" -w /app \
            -e HOST_IDS="$(id -u):$(id -g)" \
            "$IMAGE" \
            sh -c 'play deps --sync > deps.log 2>&1; deps_status=$?; cat deps.log;
                   test $deps_status -eq 0 && ! grep -q "still missing" deps.log &&
                   timeout -k 30s 25m play autotest && test -f test-result/result.passed;
                   status=$?; chown -R "$HOST_IDS" /app /root/.ivy2; exit $status'
      -
        name: Archivia i risultati dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: |
            test-result/
            logs/
            deps.log
          if-no-files-found: ignore

  # Test end-to-end con Playwright (cartella e2e/): un browser vero contro l'immagine
  # docker costruita dal commit, con un postgres vuoto. Coprono template e javascript,
  # che play autotest non esegue.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        # La cache ivy del job autotest (stessa chiave), passata alla build: play deps
        # non riscarica le dipendenze. Solo restore: la build non scrive in ~/.ivy2 e
        # non deve salvare una cache vuota sotto la chiave che popola autotest. Se la
        # chiave non c'è ancora (dipendenze cambiate) la build le scarica come in locale.
        name: Cache delle dipendenze
        uses: actions/cache/restore@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('conf/dependencies.yml', 'jars/**') }}
      -
        name: Build dell'immagine docker
        run: |
          mkdir -p ~/.ivy2
          docker build --build-context ivy="$HOME/.ivy2" -t epas:e2e .
      -
        name: Avvio di ePAS
        run: e2e/stack.sh up epas:e2e
      -
        name: Setup di Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      -
        name: Installazione delle dipendenze npm
        working-directory: e2e
        run: npm ci
      -
        # Il browser dipende dalla versione di Playwright, fissata in package-lock.json,
        # e dalla versione del sistema del runner (ImageOS).
        name: Cache del browser di Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('e2e/package-lock.json') }}
      -
        # Con il browser già in cache install non lo riscarica; le librerie di sistema
        # (--with-deps) non sono in cache e si installano sempre.
        name: Installazione del browser di Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      -
        name: Test end-to-end
        working-directory: e2e
        run: npx playwright test
      -
        name: Log di ePAS
        if: failure()
        run: e2e/stack.sh logs 2>&1 | tail -n 500
      -
        name: Archivia il report di Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
